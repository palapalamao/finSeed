name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '*.pod/ts/package-lock.json'
      - name: Test the version gate
        run: node --test scripts/check-versions.test.mjs
      - name: Check release versions
        id: metadata
        run: node scripts/check-versions.mjs
      - name: Install locked dependencies
        working-directory: ${{ steps.metadata.outputs.ui_dir }}
        run: npm ci
      - name: Frontend unit tests
        working-directory: ${{ steps.metadata.outputs.ui_dir }}
        run: npm test
      - name: Type check and production build
        working-directory: ${{ steps.metadata.outputs.ui_dir }}
        run: npm run build

  browser:
    name: UI smoke (controlled data)
    needs: source
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '*.pod/ts/package-lock.json'
      - name: Resolve frontend directory
        id: metadata
        run: node scripts/check-versions.mjs
      - name: Install locked dependencies
        working-directory: ${{ steps.metadata.outputs.ui_dir }}
        run: npm ci
      - name: Build the frontend
        working-directory: ${{ steps.metadata.outputs.ui_dir }}
        run: npm run build
      - name: Install Edge for smoke tests
        working-directory: ${{ steps.metadata.outputs.ui_dir }}
        run: npx --no-install playwright install msedge
      - name: Language, mobile and export smoke tests
        working-directory: ${{ steps.metadata.outputs.ui_dir }}
        run: npx --no-install playwright test tests/e2e/i18n.spec.ts
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            *.pod/ts/playwright-report/
            *.pod/ts/test-results/
            out/i18n-*.png
          if-no-files-found: ignore
          retention-days: 7
