[package]
name = "fin-energy-properties"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.0"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

[profile.test]
debug = 0
